<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Page</title>
</head>
<body>

    <header>
        <h1>Welcome to Our Store</h1>
        <p>Discover our amazing products at the best prices.</p>
    </header>

    <section id="discount">
        <h2>Special Offers <span style="background-color: #e74c3c; color: white; padding: 3px 8px; border-radius: 3px;">50% OFF</span></h2>
        <p>Use code <strong>MIDTERM50</strong> at checkout to get half off your first order!</p>
    </section>

    <!-- Customer Feedback Form Section -->
    <section id="feedback">
        <h2>Customer Feedback</h2>
        <form>
            <div>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div>
                <label for="comments">Feedback:</label><br>
                <textarea id="comments" name="comments" rows="4" required></textarea>
            </div>
            <br>
            <button type="submit">Submit Feedback</button>
        </form>
    </section>

</body>
</html>
